<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Inner circle container -->
  <circle cx="256" cy="256" r="210" fill="#0b1329" opacity="0.9" />

  <!-- States & Transitions Visualization -->
  <!-- Transition Edge (Curved) -->
  <path d="M 140 256 C 200 130, 310 130, 370 256" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
  <polygon points="365,245 385,260 360,270" fill="#38bdf8" />

  <!-- Return Edge -->
  <path d="M 370 256 C 310 380, 200 380, 140 256" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-dasharray="14 10" />

  <!-- Start State Node q0 -->
  <circle cx="140" cy="256" r="54" fill="#0f172a" stroke="#10b981" stroke-width="12" />
  <text x="140" y="267" font-family="'Fira Code', monospace" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">q₀</text>

  <!-- Start arrow -->
  <path d="M 40 256 L 80 256" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round" />
  <polygon points="76,246 94,256 76,266" fill="#10b981" />

  <!-- Final State Node q1 (Double Border) -->
  <circle cx="370" cy="256" r="62" fill="#0f172a" stroke="#6366f1" stroke-width="8" />
  <circle cx="370" cy="256" r="50" fill="#0f172a" stroke="#6366f1" stroke-width="8" />
  <text x="370" y="267" font-family="'Fira Code', monospace" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">q_f</text>

  <!-- Reduction / Prune Scissors / Sparkle Badge -->
  <circle cx="256" cy="256" r="32" fill="#0284c7" stroke="#ffffff" stroke-width="4" filter="url(#glow)" />
  <path d="M 246 256 L 266 256 M 256 246 L 256 266" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
</svg>
